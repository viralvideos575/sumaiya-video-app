<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    height:68px;
    background:#151515;
    border-bottom:2px solid #ff9800;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:9px;
}

.back{
    font-size:36px;
    line-height:1;
    color:#fff;
    cursor:pointer;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:.5px;
    color:#ff9800;
}

.logo-img{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ff9800;
    background:#222;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:20px 12px 45px;
}

/* =========================
   IMAGE
========================= */

.video-card{
    width:100%;
    background:#111;
    border:1px solid #333;
    border-radius:22px;
    padding:4px;
    overflow:hidden;

    box-shadow:
        0 10px 35px rgba(0,0,0,.5);
}

.video-card img{
    width:100%;
    aspect-ratio:16/9;
    display:block;
    object-fit:cover;
    border-radius:18px;
    background:#181818;
}

.image-fallback{
    display:none;

    width:100%;
    aspect-ratio:16/9;

    border-radius:18px;
    background:#151515;

    align-items:center;
    justify-content:center;

    text-align:center;

    color:#777;
    font-size:18px;
    font-weight:bold;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:17px;
}

.stat{
    background:#101010;
    border:1px solid #292929;
    border-radius:18px;

    padding:16px 5px;

    text-align:center;
    cursor:pointer;

    transition:.15s ease;
}

.stat:active{
    transform:scale(.97);
}

.stat-icon{
    font-size:28px;
    margin-bottom:7px;
}

.stat-title{
    font-size:14px;
    font-weight:700;
    color:#ddd;
}

.stat-number{
    font-size:18px;
    font-weight:900;
    margin-top:5px;
}

/* =========================
   AD BOX
========================= */

.ad-box{
    margin-top:19px;

    background:
        linear-gradient(
            145deg,
            #17130b,
            #0e0c09
        );

    border:1px dashed #ff9800;

    border-radius:23px;

    padding:21px 15px 19px;

    text-align:center;
}

.ad-title{
    color:#ffbd16;
    font-size:20px;
    font-weight:900;
    margin-bottom:17px;
}

.progress-bg{
    width:100%;
    height:10px;

    background:#292929;
    border-radius:20px;
    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ff8a00,
            #ffc107
        );

    border-radius:20px;

    transition:.4s ease;
}

.progress-text{
    font-size:20px;
    font-weight:800;
    margin-top:14px;
}

.help-text{
    color:#999;
    font-size:14px;
    line-height:1.5;
    margin-top:8px;
}

.ad-button{
    width:100%;

    margin-top:17px;

    border:0;
    border-radius:17px;

    padding:18px 12px;

    background:
        linear-gradient(
            135deg,
            #ff9800,
            #ffad19
        );

    color:#050505;

    font-size:20px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(255,152,0,.18);

    transition:.15s ease;
}

.ad-button:active{
    transform:scale(.98);
}

.ad-button:disabled{
    background:#555;
    color:#aaa;
    cursor:not-allowed;
    box-shadow:none;
}

.step-info{
    margin-top:14px;
    color:#999;
    font-size:14px;
}

/* =========================
   UNLOCK BOX
========================= */

.unlock-box{
    display:none;

    margin-top:19px;

    background:#0e1b12;

    border:1px solid #2d8a50;

    border-radius:22px;

    padding:22px 15px;

    text-align:center;
}

.unlock-title{
    color:#5cff7a;

    font-size:23px;
    font-weight:900;
}

.unlock-text{
    margin-top:10px;

    color:#aaa;

    font-size:14px;
    line-height:1.5;
}

.unlock-button{
    display:block;

    width:100%;

    margin-top:18px;

    padding:18px 12px;

    border-radius:16px;

    background:#22c55e;

    color:#fff;

    text-decoration:none;

    font-size:19px;
    font-weight:900;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    margin-top:27px;

    color:#555;

    font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        height:65px;
        padding:0 13px;
    }

    .back{
        font-size:34px;
    }

    .logo{
        font-size:22px;
    }

    .logo-img{
        width:40px;
        height:40px;
    }

    .container{
        padding:
            18px
            11px
            40px;
    }

    .stats{
        gap:8px;
        margin-top:15px;
    }

    .stat{
        padding:
            15px
            4px;

        border-radius:17px;
    }

    .stat-icon{
        font-size:26px;
    }

    .stat-title{
        font-size:13px;
    }

    .stat-number{
        font-size:17px;
    }

    .ad-box{
        margin-top:17px;

        padding:
            20px
            14px
            18px;
    }

    .ad-title{
        font-size:19px;
    }

    .ad-button{
        font-size:19px;

        padding:
            17px
            10px;
    }

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo-area">

        <div
            class="back"

        >

        </div>

    <!-- Logo -->
    <img

        onerror="this.style.display='none';"
    >

<main class="container">


<!-- =========================

<div class="video-card">

    <!--
        preview.jpg - আপনার GitHub Pages root এ থাকা ছবি
        বট দিয়ে এটি automatic update হয়
    -->

    <img
        id="previewImage"
        src="preview.jpg"
        alt="Viral Video"
        onerror="imageError()"

<div class="stats">

    <div class="stat">

        <div class="stat-icon">

        </div>

        </div>

    <div
        class="stat"
        id="shareButton"
    >

        <div class="stat-icon">
            ➤
        </div>

        <div class="stat-title">

        </div>

        <div class="stat-number">
            Share
        </div>

    </div>

</div>


<!-- =========================
     REWARDED AD SYSTEM
========================= -->

<section class="ad-box">

    <div class="ad-title">
        ▶ Watch 4 ads to unlock
    </div>


    <div class="progress-bg">

        <div
            class="progress"
            id="progress"
        ></div>

    </div>


    <div class="progress-text">

        Progress:
        <span id="count">
            0
        </span>/4

    </div>


    <div

    </div>


    <button

        <span id="step">

        </span>

<!-- =========================

<section
    class="unlock-box"
    id="unlockBox"
>

    <div class="unlock-title">

    </div>


    <div class="unlock-text">

        সবগুলো ধাপ সম্পন্ন হয়েছে।

        <br>

        এখন নিচের বাটনে ক্লিক করে ভিডিও দেখুন।

    </div>


    <a
        class="unlock-button"
        href="https://t.me/sumsyasayed8676"
        target="_blank"

    >

    </a>

</main>


<script>

/* =========================================
   TELEGRAM VIDEO
========================================= */

const TELEGRAM_VIDEO =
    "https://t.me/sumsyasayed8676";


/* =========================================
   SETTINGS
========================================= */

const TOTAL_ADS = 4;

const UI_COOLDOWN = 15;


/* =========================================
   STATE
========================================= */

let completed = 0;

let adRunning = false;

let cooldownTimer = null;

let cooldownRemaining = 0;

let rewardedReceived = false;


/* =========================================
   ELEMENTS
========================================= */

const adButton =
    document.getElementById("adButton");

const status =
    document.getElementById("status");

const progress =
    document.getElementById("progress");

const count =
    document.getElementById("count");

const step =
    document.getElementById("step");

const unlockBox =
    document.getElementById("unlockBox");


/* =========================================
   IMAGE ERROR
========================================= */

function imageError(){

    const img =
        document.getElementById(
            "previewImage"
        );

    const fallback =
        document.getElementById(
            "imageFallback"
        );

    img.style.display =
        "none";

    fallback.style.display =
        "flex";

}


/* =========================================
   BACK BUTTON
========================================= */

function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }else{

        window.location.href =
            TELEGRAM_VIDEO;

    }

}


/* =========================================
   UPDATE PROGRESS
========================================= */

function updateProgress(){

    const percentage =
        (completed / TOTAL_ADS) * 100;

    progress.style.width =
        percentage + "%";

    count.innerText =
        completed;

    if(
        completed >= TOTAL_ADS
    ){

        step.innerText =
            TOTAL_ADS;

    }else{

        step.innerText =
            completed + 1;

    }

}


/* =========================================
   START COOLDOWN
========================================= */

function startCooldown(){

    clearInterval(
        cooldownTimer
    );

    cooldownRemaining =
        UI_COOLDOWN;

    adButton.disabled =
        true;

    adButton.innerText =
        "⏳ " +
        cooldownRemaining +
        " সেকেন্ড";

    status.innerText =
        "বিজ্ঞাপন থেকে ফিরে এসেছেন। অপেক্ষা করুন...";

    cooldownTimer =
        setInterval(function(){

            cooldownRemaining--;

            if(
                cooldownRemaining > 0
            ){

                adButton.innerText =
                    "⏳ " +
                    cooldownRemaining +
                    " সেকেন্ড";

            }else{

                clearInterval(
                    cooldownTimer
                );

                cooldownTimer =
                    null;

                finishAdAttempt();

            }

        },1000);

}


/* =========================================
   FINISH AD ATTEMPT
========================================= */

function finishAdAttempt(){

    if(
        !rewardedReceived
    ){

        adRunning =
            false;

        adButton.disabled =
            false;

        adButton.innerText =
            "🔄 Try Again";

        status.innerText =
            "বিজ্ঞাপনের reward পাওয়া যায়নি। আবার চেষ্টা করুন।";

        return;

    }


    completed++;

    rewardedReceived =
        false;

    adRunning =
        false;

    updateProgress();


    if(
        completed >= TOTAL_ADS
    ){

        unlockVideo();

        return;

    }


    adButton.disabled =
        false;

    adButton.innerText =
        "🔒 Next Ad";

    status.innerText =
        "পরবর্তী বিজ্ঞাপন দেখতে Next Ad চাপুন";

}


/* =========================================
   SHOW REWARDED AD
========================================= */

async function startAd(){

    if(
        adRunning
    ){

        return;

    }


    if(
        completed >= TOTAL_ADS
    ){

        unlockVideo();

        return;

    }


    if(
        typeof show_11680537 !==
        "function"
    ){

        status.innerText =
            "Advertisement system এখনো load হয়নি। কয়েক সেকেন্ড পরে চেষ্টা করুন।";

        return;

    }


    adRunning =
        true;

    rewardedReceived =
        false;

    adButton.disabled =
        true;

    adButton.innerText =
        "⏳ Opening Ad...";

    status.innerText =
        "Advertisement loading...";


    try{

        await show_11680537();

        rewardedReceived =
            true;

        startCooldown();

    }catch(error){

        console.log(
            "Monetag Ad Error:",
            error
        );

        adRunning =
            false;

        rewardedReceived =
            false;

        adButton.disabled =
            false;

        adButton.innerText =
            "🔄 Try Again";

        status.innerText =
            "Advertisement সম্পূর্ণ হয়নি। আবার চেষ্টা করুন।";

    }

}


/* =========================================
   AD BUTTON
========================================= */

adButton.addEventListener(
    "click",
    function(){

        startAd();

    }
);


/* =========================================
   UNLOCK VIDEO
========================================= */

function unlockVideo(){

    completed =
        TOTAL_ADS;

    progress.style.width =
        "100%";

    count.innerText =
        TOTAL_ADS;

    step.innerText =
        TOTAL_ADS;

    status.innerText =
        "সবগুলো Advertisement Step Complete!";

    adButton.style.display =
        "none";

    unlockBox.style.display =
        "block";


    const telegramButton =
        document.querySelector(
            ".unlock-button"
        );


    if(
        telegramButton
    ){

        telegramButton.href =
            TELEGRAM_VIDEO;

    }

}


/* =========================================
   SHARE
========================================= */

document
.getElementById("shareButton")
.addEventListener(
    "click",
    async function(){

        if(
            navigator.share
        ){

            try{

                await navigator.share({

                    title:
                        "Viral Video",

                    text:
                        "এই ভিডিওটি দেখুন",

                    url:
                        window.location.href

                });

            }catch(error){

                console.log(
                    "Share cancelled"
                );

            }

        }else{

            try{

                await navigator.clipboard.writeText(
                    window.location.href
                );

                alert(
                    "লিংক কপি হয়েছে!"
                );

            }catch(error){

                alert(
                    "লিংক কপি করা যায়নি!"
                );

            }

        }

    }
);


/* =========================================
   CACHE-BUSTED PREVIEW IMAGE
========================================= */

document.getElementById("previewImage").src =
    "preview.jpg?v=" + Date.now();


/* =========================================
   INITIALIZE
========================================= */

updateProgress();

</script>

</body>
</html>
